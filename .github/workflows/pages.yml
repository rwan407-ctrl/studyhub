name: Deploy static site to Pages

# 2026-07-26: the legacy (branch-based) Pages build started failing with
# "likely failed because of a workflow file issue" and no job logs, so publish
# explicitly via Actions instead. The repo is plain static HTML - no Jekyll.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Skip Jekyll processing
        run: touch .nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
